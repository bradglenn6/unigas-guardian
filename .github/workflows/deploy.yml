name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGION: us-central1
  SERVICE_NAME: zerolabz-guardian-service
  REPO_NAME: cloud-run-source-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry & Serverless Agent Permissions
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format="value(projectNumber)")

          # Ensure the Artifact Registry repository exists
          gcloud artifacts repositories describe "${{ env.REPO_NAME }}" \
            --location="${{ env.REGION }}" --project="$PROJECT_ID" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${{ env.REPO_NAME }}" \
            --repository-format=docker \
            --location="${{ env.REGION }}" \
            --project="$PROJECT_ID"

          # Ensure Cloud Run Service Agent can import images from Artifact Registry
          gcloud artifacts repositories add-iam-policy-binding "${{ env.REPO_NAME }}" \
            --location="${{ env.REGION }}" \
            --project="$PROJECT_ID" \
            --member="serviceAccount:service-${PROJECT_NUMBER}@serverless-robot-prod.iam.gserviceaccount.com" \
            --role="roles/artifactregistry.reader" --quiet || true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

          # Disable provenance/SBOM attestations to prevent Cloud Run ContainerImageImportFailed
          DOCKER_BUILDKIT=1 docker build --provenance=false --sbom=false --platform linux/amd64 -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_URI }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --timeout=300